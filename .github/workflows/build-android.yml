name: Build Android APK (TobySatranc.apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Frontend & Sync Capacitor Android
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android APK (assembleDebug)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TobySatranc.apk

      - name: Upload TobySatranc.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: TobySatranc-Android-APK
          path: TobySatranc.apk
          retention-days: 90
