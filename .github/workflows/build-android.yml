name: Build Android APK (TobySatranc.apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Export Official Toby 2.0 INT8 ONNX Models for Offline Android
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q chess numpy onnx onnxruntime onnxscript
          git clone --depth 1 https://github.com/Yosha87/Toby.git /tmp/toby-src
          TOBY_INSTALL_DIR=/tmp/toby-engine bash scripts/install_toby.sh
          python3 scripts/export_toby_onnx.py \
            --toby-src /tmp/toby-src \
            --nets-dir /tmp/toby-engine/Toby/nets \
            --out-dir frontend/android/app/src/main/assets/toby-models
          ls -lh frontend/android/app/src/main/assets/toby-models

      - name: Build Frontend & Sync Capacitor Android
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build 100% Offline Android APK (assembleDebug)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TobySatranc-Offline.apk
          ls -lh TobySatranc-Offline.apk

      - name: Upload TobySatranc-Offline.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: TobySatranc-Android-Offline-APK
          path: TobySatranc-Offline.apk
          retention-days: 90
